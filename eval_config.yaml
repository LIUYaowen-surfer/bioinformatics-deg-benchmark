# Benchmark specification, not a Conda environment file or an executable runner.
# Nothing here installs software, mounts data, or enforces isolation by itself.
schema_version: 1
benchmark:
  name: bioinformatics-deg-benchmark
  task_count: 23
  paper_count: 20
  task_pattern: task_{number:02d}
  prompt: agent_prompt.md
  workflow: agent_selected

environment:
  status: proposed_not_installed_or_integration_tested
  version_policy: >-
    Suggested historical baseline, not a claim about the latest releases or the
    authors' software versions. Resolve dependencies and freeze an image digest
    or complete package lock before comparing agents. Record any deviations.
  os:
    family: Linux
    suggested_distribution: Ubuntu
    suggested_release: "24.04 LTS"
    architecture: x86_64
    image_digest: null
  runtimes:
    python:
      version: "3.12.8"
      source: https://www.python.org/downloads/release/python-3128/
    R:
      version: "4.4.2"
      source: https://cran.r-project.org/src/base/R-4/
    bioconductor:
      version: "3.20"
      source: https://bioconductor.org/about/release-announcements/
  python_libraries:
    numpy:
      version: "1.26.4"
      source: https://github.com/numpy/numpy/releases/tag/v1.26.4
    scipy:
      version: "1.14.1"
      source: https://docs.scipy.org/doc/scipy/release/1.14.1-notes.html
    pandas:
      version: "2.2.3"
      source: https://pandas.pydata.org/docs/whatsnew/v2.2.3.html
    matplotlib:
      version: "3.9.2"
      source: https://github.com/matplotlib/matplotlib/releases/tag/v3.9.2
  tool_policy: >-
    Preconfigure these resources for the agent. Each is optional to use; no
    ordered pipeline or mandatory statistical method is prescribed. Keep the
    available tool set consistent across agents evaluated on the same task.
  tools:
    FastQC:
      version: "0.12.1"
      role: read_quality_reports
      source: https://github.com/s-andrews/FastQC/releases/tag/v0.12.1
    fastp:
      version: "0.24.0"
      role: read_processing
      source: https://github.com/OpenGene/fastp/releases/tag/v0.24.0
    STAR:
      version: "2.7.11b"
      role: spliced_alignment
      source: https://github.com/alexdobin/STAR/releases/tag/2.7.11b
    HISAT2:
      version: "2.2.1"
      role: spliced_alignment
      source: https://github.com/DaehwanKimLab/hisat2/releases/tag/v2.2.1
    Salmon:
      version: "1.10.3"
      role: transcript_quantification
      source: https://github.com/COMBINE-lab/salmon/releases/tag/v1.10.3
    samtools:
      version: "1.21"
      role: alignment_file_operations
      source: https://github.com/samtools/samtools/releases/tag/1.21
    featureCounts:
      package: subread
      version: "2.0.6"
      role: gene_read_counting
      source: https://sourceforge.net/projects/subread/files/subread-2.0.6/
    DESeq2:
      version: "1.46.0"
      role: differential_expression
      source: https://bioconductor.posit.co/packages/3.20/bioc/html/DESeq2.html
    edgeR:
      version: "4.4.2"
      role: differential_expression
      source: https://bioconductor.posit.co/packages/3.20/bioc/html/edgeR.html
    limma:
      version: "3.62.2"
      role: differential_expression
      source: https://bioconductor.posit.co/packages/3.20/bioc/html/limma.html
  dependency_policy: >-
    Also install and record transitive libraries and runtime dependencies,
    including a compatible Java runtime for FastQC. This is not a dependency
    lock. Check executable versions and R package loading before offline use.
  offline_package_cache: null
  resolved_package_lock: null

execution:
  network_access: false
  enforcement: external_runner_required
  isolation: >-
    Run in a fresh workspace with an explicit input allowlist. Disable the
    agent's tool/browser/network access at the runner or operating-system level;
    keep evaluation files, host directories and previous-task artifacts unmounted.
  limits:
    cpu_cores: null
    memory_gib: null
    wall_time_seconds: null
    disk_gib: null
  limits_policy: >-
    Values are not yet fixed. Measure task requirements and record explicit,
    comparable limits before formal runs; null does not mean a published limit.

agent_input:
  workspace_layout:
    prompt: agent_prompt.md
    treated_reads: input/data/treated/
    untreated_reads: input/data/untreated/
    sample_manifest: input/samples.tsv
    local_reference_resources: resources/
    optional_software_cache: packages/
  reads: full_quality_raw_FASTQ_or_FASTQ_gz
  sample_manifest:
    unit: one_row_per_sequencing_run_or_library_file_set
    required_columns: [sample_id, condition, read_layout, fastq_r1]
    conditional_columns: [fastq_r2, unpaired_fastq, run_id, donor_id, pair_id, batch]
    condition_values: [treated, untreated]
    rules: >-
      Use anonymous IDs and workspace-relative paths. Keep the same sample_id
      across technical runs of one biological sample. Preserve mate relationships,
      known donor pairing and batch/block information. Use fastq_r1 for single-end
      reads too; fastq_r2 is required only for paired-end data. Do not invent
      pairing or batch labels from sample order. Retain unpaired reads when present.
  exclude_from_workspace:
    - full_repository_and_git_history
    - root_and_task_README_files
    - filelink.md_and_download_logs
    - all_reference_top100.json_files
    - author_DEG_tables_papers_and_source_archives
    - extract_reference.py
    - score_deg.py_and_evaluator_configuration
  anonymization: >-
    Keep source-to-alias mapping outside the workspace. Remove study accessions
    from filenames, paths, FASTQ headers/descriptions and compressed metadata,
    preserving every sequence, quality score, record order and mate relationship.
    Anonymization cannot guarantee absence of prior training-data exposure.

reference_resources:
  status: task_specific_resources_not_yet_frozen
  storage: outside_git
  policy: >-
    Resolve these defaults separately for the selected task, using its research
    README. Record source URLs, exact releases, local paths and SHA-256 values in
    an evaluator-side deployment manifest. Give the agent the necessary genome,
    annotation and biological design only. Preserve the author ID namespace,
    including custom XLOC and versioned IDs; do not silently substitute a current
    annotation. Unknown builds remain unset until checked.
  defaults:
    genome: {assembly: null, source_url: null, local_path: null, sha256: null}
    annotation: {release: null, format: null, gene_id_attribute: null, source_url: null, local_path: null, sha256: null}
    transcriptome: {local_path: null, sha256: null}
    transcript_to_gene_map: {local_path: null, sha256: null}
    indexes: []
  index_policy: >-
    Supply compatible indexes for available workflows, or allow offline index
    construction from the staged reference sequences and annotation. For every
    supplied index record tool/version, build parameters, source checksums and
    local path. Transcript quantification may need transcript sequences and a
    transcript-to-gene map. No precomputed expression values or DEG results.
  tasks:
    task_01: {species: Homo sapiens}
    task_02: {species: Mus musculus}
    task_03: {species: Homo sapiens}
    task_04: {species: Homo sapiens}
    task_05: {species: Homo sapiens}
    task_06: {species: Homo sapiens}
    task_07: {species: Homo sapiens}
    task_08: {species: Homo sapiens, note: Preserve author assembled ucscCodingXLOC annotation.}
    task_09: {species: Homo sapiens, note: Preserve versioned Ensembl identifiers.}
    task_10: {species: Homo sapiens, note: Preserve author XLOC identifiers.}
    task_11: {species: Saccharomyces cerevisiae, note: W303 and original coding/noncoding features.}
    task_12: {species: Homo sapiens}
    task_13: {species: Danio rerio, note: Preserve matching RNAoldyoung merged annotation and XLOC IDs.}
    task_14: {species: Mus musculus, note: Resolve documented mm9/mm10 metadata conflict before freezing resources.}
    task_15: {species: Arabidopsis thaliana}
    task_16: {species: Mus musculus}
    task_17: {species: Drosophila melanogaster}
    task_18: {species: Mus musculus}
    task_19: {species: Mus musculus}
    task_20: {species: Homo sapiens}
    task_21: {species: Mus musculus}
    task_22: {species: Mus musculus}
    task_23: {species: Mus musculus}
  overrides: {}

output:
  filename: result.json
  format: JSON
  keys_exactly: [up, down]
  genes_per_direction: 100
  identifier_type: nonempty_string
  unique_within_lists: true
  disjoint_lists: true
  direction: log2_treated_over_untreated
  ranking: adjusted_p_value_ascending_then_gene_ID_string_ascending
  additional_significance_cutoff: null
  additional_fold_change_cutoff: null
  exclude: [invalid_tests, missing_ID_or_test_result, zero_log2_fold_change]
  final_response: same_JSON_only

scoring:
  script: score_deg.py
  run_location: evaluator_only
  reference_path_template: task_{number:02d}/reference/top100.json
  command: python score_deg.py result.json task_01/reference/top100.json
  formula: size(prediction.up intersect reference.up) + size(prediction.down intersect reference.down)
  minimum: 0
  maximum: 200
  normalization: none
  gene_matching: exact_string_case_and_version_sensitive
  list_order_affects_score: false
  invalid_output: error_exit_2_no_numeric_score
  consumes_this_yaml: false
